[project]
name = "spry-backend"
version = "0.1.0"
description = "Spry Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.28.0",
    "sqlalchemy==2.0.28",
    "alembic==1.13.1",
    "pydantic==2.6.4",
    "psycopg2-binary==2.9.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx<0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
