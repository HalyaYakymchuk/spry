AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cognito User Pool with Google OAuth 2.0 and Managed Login v2'

Parameters:
  ProjectName:
    Type: String
    Default: spry
  CognitoDomainPrefix:
    Type: String
    Default: peach-ayth-halya
  CloudFrontDomain:
    Type: String
    Default: d2l89vyn3q02js.cloudfront.net
  FrontendPort:
    Type: Number
    Default: 3000
  GoogleClientId:
    Type: String
  GoogleClientSecret:
    Type: String
    NoEcho: true

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool'
      UserPoolTier: ESSENTIALS
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      UserPoolTags:
        Project: !Ref ProjectName

  UserPoolIdentityProviderGoogle:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'openid email profile'
      AttributeMapping:
        email: email
        email_verified: email_verified

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolIdentityProviderGoogle
    Properties:
      ClientName: !Sub '${ProjectName}-web-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs:
        - !Sub 'https://${CloudFrontDomain}/auth/callback'
        - !Sub 'https://${CloudFrontDomain}/auth/callback/'
        - !Sub 'http://localhost:${FrontendPort}/auth/callback'
        - !Sub 'http://localhost:${FrontendPort}/auth/callback/'
      LogoutURLs:
        - !Sub 'https://${CloudFrontDomain}'
        - !Sub 'https://${CloudFrontDomain}/'
        - !Sub 'http://localhost:${FrontendPort}'
        - !Sub 'http://localhost:${FrontendPort}/'

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn:
      - UserPoolDomain
      - UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
